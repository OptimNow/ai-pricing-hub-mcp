# Deploys a release tag to Fly.io, or only checks what the live server serves.
#
# WHY. A release that misbehaves in production had two ways back: a revert
# pull request, which is a new release with its own review and CI, or a
# `fly deploy` from a laptop, which nothing checks. This is the third, taken
# from the Cloud FinOps connector's deploy-hosted.yml
# (OptimNow/cloud-finops-skills): deploy an earlier tag in a few minutes, from
# the Actions tab, and check it as ci.yml checks every deploy.
#
# Run it from Actions -> Deploy a release tag -> Run workflow, or:
#   gh workflow run deploy-tag.yml -f tag=v0.12.1
#   gh workflow run deploy-tag.yml -f tag=v0.12.1 -f verify_only=true
#
# WHAT IT DEPLOYS. A tag, never a branch: the image is built from the tagged
# commit, its Dockerfile, its fly.toml. The github-release job of ci.yml
# creates a tag v<version> for every version deployed since 0.11.0. The image
# is labelled with the tag's commit, as ci.yml labels its own, so the next
# push to master diffs against what is really live.
#
# A ROLLBACK LASTS UNTIL THE NEXT PUSH TO MASTER, which deploys master again.
# Use the time it buys to merge the fix, or the revert.
#
# IT PUBLISHES NOTHING. Not to the MCP registry, where a version can never be
# edited and the rolled-back version is already listed; not as a release. The
# check that follows is this workflow's own copy of scripts/check-connector.mjs,
# from the ref the run is dispatched on, so a tag older than that script can
# still be checked, against the version the tag declares.
#
# Needs the FLY_API_TOKEN repository secret (not for `verify_only`), the same
# app-scoped deploy token ci.yml uses.
#
# The deploy step mirrors the one in ci.yml (flyctl version, image label,
# concurrency group): change both together.

name: Deploy a release tag

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to deploy, e.g. v0.12.1"
        required: true
        type: string
      verify_only:
        description: "Deploy nothing: only check that the live server serves this tag"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  deploy:
    if: github.repository == 'OptimNow/ai-pricing-hub-mcp'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The group ci.yml's deploy job takes: one rollout at a time, and never one
    # cancelled halfway through.
    concurrency:
      group: fly-deploy
      cancel-in-progress: false
    steps:
      # A capital V or a missing v is tolerated; anything that is not a release
      # tag is refused. The input reaches the shell through the environment,
      # never by substitution into the script.
      - name: Resolve and validate the tag
        id: resolve
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          tag="${INPUT_TAG#V}"
          tag="v${tag#v}"
          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'${INPUT_TAG}' is not a release tag. Expected the form v0.12.1."
            exit 1
          fi
          if ! git ls-remote --exit-code --tags "https://github.com/${GITHUB_REPOSITORY}" "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "::error::Tag ${tag} does not exist in ${GITHUB_REPOSITORY}. The Releases page lists the tags."
            exit 1
          fi
          echo "Resolved to ${tag}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      # This workflow's ref, for the check script.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # What gets deployed, and what the server is compared with.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: refs/tags/${{ steps.resolve.outputs.tag }}
          path: release
          persist-credentials: false

      - name: Read the tag's commit and version
        id: release
        run: |
          set -euo pipefail
          sha=$(git -C release rev-parse HEAD)
          version=$(jq -er .version release/server.json)
          echo "The tag is commit $sha and declares version $version."
          { echo "sha=$sha"; echo "version=$version"; } >> "$GITHUB_OUTPUT"

      # Fail with a sentence rather than with flyctl's authentication error.
      - name: Check the Fly.io deploy token is set
        if: ${{ !inputs.verify_only }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if [ -z "${FLY_API_TOKEN}" ]; then
            echo "::error::The FLY_API_TOKEN repository secret is empty or missing. It is the deploy token ci.yml uses: fly tokens create deploy --app ai-pricing-hub-mcp"
            exit 1
          fi

      - if: ${{ !inputs.verify_only }}
        uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # 1.6
        with:
          version: 0.5.14

      # Builds the tag's Dockerfile on Fly's remote builder (app and settings
      # from the tag's fly.toml) and rolls the machine.
      - name: Build the image from the tag and roll the machine
        if: ${{ !inputs.verify_only }}
        working-directory: release
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          SHA: ${{ steps.release.outputs.sha }}
        run: flyctl deploy --remote-only --image-label "$SHA"

      - name: Check every machine runs the tag's image
        if: ${{ !inputs.verify_only }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          SHA: ${{ steps.release.outputs.sha }}
        run: |
          set -euo pipefail
          tags=$(flyctl machine list --app ai-pricing-hub-mcp --json | jq -r '[.[].image_ref.tag] | unique | join(" ")')
          echo "Machines run: ${tags:-nothing readable}; the tag: $SHA"
          if [ "$tags" != "$SHA" ]; then
            echo "::error title=Not the tag's image::The machines run '${tags:-nothing readable}', not $SHA."
            exit 1
          fi

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      # Exit 2: the server passed and the site could not be read. A warning.
      - name: Check the live connector serves the tag
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set +e
          node scripts/check-connector.mjs https://ai-pricing-hub-mcp.fly.dev/mcp \
            --expect-version "$VERSION" --attempts 6 --delay 10 --output "$RUNNER_TEMP/connector-check.md"
          code=$?
          set -e
          cat "$RUNNER_TEMP/connector-check.md" >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          case "$code" in
            0) ;;
            2) echo "::warning title=Site not read::The connector passed; optimtoken.optimnow.io could not be read during the check." ;;
            *) exit 1 ;;
          esac
