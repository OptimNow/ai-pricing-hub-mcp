# Publishes server.json to the official MCP registry
# (https://registry.modelcontextprotocol.io).
#
# WHEN IT RUNS.
#   1. After every deploy: ci.yml calls it once its `deploy` job has put master
#      live. Most of those runs publish nothing: the registry already holds the
#      version, the job says so and stops. The run that follows a version bump
#      publishes.
#   2. By hand (Actions -> Publish to the MCP registry -> Run workflow, on
#      master), to catch up after a run that could not publish.
#
# WHY. Publishing was a manual run of the registry's CLI on a maintainer's
# machine, after the deploy: download mcp-publisher, log in with GitHub in a
# browser, publish. It is the step that gets forgotten. On 2026-11-12 the
# registry still listed 0.4.2 while production served 0.9.0: five releases had
# gone by without it. That day it became this workflow, started by hand, and
# then, on the owner's decision, a step of every deploy, as the Cloud FinOps
# connector's release chain already had it (OptimNow/cloud-finops-skills).
#
# WHAT STAYS A DECISION. A published version can never be edited. The registry
# gets a new entry only when the version in server.json changes, which is an
# edit by hand of four files that version.test.ts holds together. So the pull
# request that bumps the version is where the publish is decided: read
# server.json there (title, description, URL) as what the registry will show
# for that version, for good.
#
# NO SECRET IS STORED. The registry accepts GitHub's OIDC token for a workflow
# run as proof that the run belongs to this repository, and lets it publish
# under io.github.OptimNow/. `id-token: write` is the whole credential, and it
# exists only for the life of a run. By hand, the CLI's browser login works
# only as the OptimNow account itself: on GitHub OptimNow is a user account,
# not an organisation, so io.github.OptimNow/ is that account's own namespace.
#
# IT REFUSES TO PUBLISH A VERSION THE LIVE SERVER DOES NOT ANNOUNCE. Publishing
# first would list a version the endpoint does not serve. After a deploy this
# repeats, on the published URL, the check the `deploy` job made on the fly.dev
# host; by hand it is the only one.
#
# A REGISTRY THAT DOES NOT ANSWER is not a failure of this repository. After a
# deploy it is a warning and a green run, and nothing is published: a red CI
# for somebody else's outage teaches everyone to ignore the job. Nothing is
# lost: the next deploy asks again, and so does a run by hand. By hand the run
# fails, because somebody is waiting for that publish.
#
# The CLI is pinned to a release and its Sigstore signature is verified before
# it runs, as the registry's own guide does it
# (docs/modelcontextprotocol-io/github-actions.mdx in
# modelcontextprotocol/registry, read 2026-11-12). To upgrade, change
# MCP_PUBLISHER_VERSION deliberately; never download `releases/latest`.

name: Publish to the MCP registry

on:
  workflow_dispatch: {}
  workflow_call:
    inputs:
      after_deploy:
        description: Set by ci.yml. A registry that does not answer is then a warning, not a failure.
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write # the run's OIDC token, which the registry reads

jobs:
  publish:
    # master only: it is what is deployed, and server.json is read from disk.
    if: github.repository == 'OptimNow/ai-pricing-hub-mcp' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # One publish at a time: the second of two runs finds the version held.
    concurrency:
      group: publish-registry
      cancel-in-progress: false
    env:
      MCP_PUBLISHER_VERSION: v1.8.1
      REGISTRY: https://registry.modelcontextprotocol.io
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Read the manifest
        id: manifest
        run: |
          set -euo pipefail
          name=$(jq -er .name server.json)
          version=$(jq -er .version server.json)
          url=$(jq -er '.remotes[0].url' server.json)
          versions="$REGISTRY/v0/servers/$(jq -rn --arg n "$name" '$n | @uri')/versions"
          {
            echo "name=$name"
            echo "version=$version"
            echo "url=$url"
            echo "entry=$versions/$(jq -rn --arg v "$version" '$v | @uri')"
            echo "latest=$versions/latest"
          } >> "$GITHUB_OUTPUT"
          echo "server.json: $name $version, served at $url"

      # The address of this one version, not versions/latest: it answers "is
      # this version held" whichever version is the latest, 200 or 404.
      - name: Ask the registry whether it holds this version
        id: registry
        env:
          VERSION: ${{ steps.manifest.outputs.version }}
          ENTRY: ${{ steps.manifest.outputs.entry }}
          AFTER_DEPLOY: ${{ inputs.after_deploy }}
        run: |
          set -euo pipefail
          status=$(curl --silent --show-error --max-time 30 --retry 2 \
            --output /dev/null --write-out '%{http_code}' "$ENTRY" || true)
          # curl prints 000 when no HTTP answer came back at all.
          [ "$status" != "000" ] || status=""
          echo "$ENTRY -> HTTP ${status:-none, no answer}"
          case "$status" in
            200)
              state=held
              echo "::notice title=Nothing to publish::The registry already holds $VERSION."
              echo "The MCP registry already holds \`$VERSION\`. Nothing was published." >> "$GITHUB_STEP_SUMMARY"
              ;;
            404)
              state=publish
              echo "The registry does not hold $VERSION: publishing it."
              ;;
            *)
              if [ "$AFTER_DEPLOY" = "true" ]; then
                state=unreadable
                echo "::warning title=MCP registry not asked::The registry gave no usable answer (HTTP ${status:-none}), so whether it holds $VERSION is not known and nothing was published. The next deploy asks again; to publish now, run this workflow by hand on master."
                echo "The MCP registry gave no usable answer (HTTP ${status:-none}). Whether it holds \`$VERSION\` is not known. Nothing was published." >> "$GITHUB_STEP_SUMMARY"
              else
                echo "::error title=The registry gave no usable answer::HTTP ${status:-none} from $ENTRY. Nothing was published. Run this again when the registry answers."
                exit 1
              fi
              ;;
          esac
          echo "state=$state" >> "$GITHUB_OUTPUT"

      # After a deploy, the `deploy` job of ci.yml has just made this check on
      # the fly.dev host. Here it is made on the URL server.json publishes. It
      # fails when a run by hand is started before the deploy has finished, or
      # after a deploy that did not go through.
      - name: Refuse a version the live server does not announce
        if: steps.registry.outputs.state == 'publish'
        env:
          VERSION: ${{ steps.manifest.outputs.version }}
          URL: ${{ steps.manifest.outputs.url }}
        run: |
          set -euo pipefail
          answer=$(curl --fail --silent --show-error --max-time 60 --retry 2 -X POST "$URL" \
            -H "content-type: application/json" \
            -H "accept: application/json, text/event-stream" \
            -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"publish-registry","version":"0"}}}')
          live=$(printf '%s' "$answer" | grep -o '"version":"[^"]*"' | head -n 1 | cut -d'"' -f4 || true)
          echo "The live server announces: ${live:-nothing readable}"
          if [ "$live" != "$VERSION" ]; then
            echo "::error title=Not deployed yet::server.json declares $VERSION and $URL announces '${live:-nothing readable}'. Publishing now would list a version the endpoint does not serve. Wait for the deploy job of CI on master, then run this again."
            exit 1
          fi

      - name: Install cosign
        if: steps.registry.outputs.state == 'publish'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # As the registry's guide writes it, the release pinned above.
      - name: Download and verify mcp-publisher
        if: steps.registry.outputs.state == 'publish'
        run: |
          set -euo pipefail
          os="$(uname -s | tr '[:upper:]' '[:lower:]')"
          arch="$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')"
          archive="mcp-publisher_${os}_${arch}.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"

          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"

      # Against the registry, without publishing: a manifest it would refuse
      # (a description over 100 characters kept 0.3.0 out) stops here.
      - name: Validate the manifest
        if: steps.registry.outputs.state == 'publish'
        run: ./mcp-publisher validate

      - name: Authenticate to the registry with this run's OIDC token
        if: steps.registry.outputs.state == 'publish'
        run: ./mcp-publisher login github-oidc

      - name: Publish
        if: steps.registry.outputs.state == 'publish'
        run: ./mcp-publisher publish

      # Read back from the registry, not taken from the CLI's exit code. The
      # per-version and versions/latest addresses, not the ?search= listing:
      # right after the 0.4.1 publish the listing still showed 0.4.0.
      - name: Confirm what the registry holds
        if: steps.registry.outputs.state == 'publish'
        env:
          VERSION: ${{ steps.manifest.outputs.version }}
          URL: ${{ steps.manifest.outputs.url }}
          ENTRY: ${{ steps.manifest.outputs.entry }}
          LATEST: ${{ steps.manifest.outputs.latest }}
        run: |
          set -euo pipefail
          entry=$(curl --fail --silent --show-error --max-time 30 --retry 2 "$ENTRY")
          held=$(printf '%s' "$entry" | jq -r '.server.version // empty')
          remote=$(printf '%s' "$entry" | jq -r '.server.remotes[0].url // empty')
          latest=$(curl --silent --show-error --max-time 30 "$LATEST" | jq -r '.server.version // empty' || true)
          {
            echo "### MCP registry"
            echo
            echo "- Published: \`${held:-nothing readable}\` (server.json: \`$VERSION\`)"
            echo "- Remote: \`${remote:-nothing readable}\` (server.json: \`$URL\`)"
            echo "- Its latest version: \`${latest:-not readable}\`"
            echo "- $ENTRY"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$held" != "$VERSION" ] || [ "$remote" != "$URL" ]; then
            echo "::error title=The registry does not hold what was published::It holds '${held:-nothing}' at '${remote:-nothing}', server.json declares $VERSION at $URL."
            exit 1
          fi
          echo "The registry holds $held at $remote (its latest: ${latest:-not readable})."
