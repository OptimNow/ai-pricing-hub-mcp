name: CI

on:
  pull_request:
  push:
    branches: [master]
  # Lets a deploy be re-run by hand from the Actions tab.
  workflow_dispatch:

# Every action is pinned to a commit, with its release beside it, as in the
# Cloud FinOps connector's workflows: a tag can be moved to other code, a
# commit cannot. The deploy job hands these steps the Fly.io deploy token's
# environment. To upgrade, read the action's release notes and change the
# commit and the comment together.

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # Matches the engines field in package.json.
          node-version: "24"
          cache: npm

      - run: npm ci

      # Type-checks the server, then the test files separately —
      # tests are excluded from the build config so they stay out of dist.
      - run: npm run typecheck

      # Offline and deterministic: nothing beyond localhost, where the tests of
      # check-connector.mjs start a stand-in connector and a stand-in site.
      - run: npm test

      - run: npm run build

      # The real server, before production. Everything above reads the source
      # or calls functions; nothing started the server, because index.ts
      # listens as soon as it is imported and so no test imports it. A build
      # that failed at start-up, or answered a tool wrongly, was found by the
      # `deploy` job, with the previous image already replaced. The Cloud
      # FinOps connector runs its real tools before a merge; this is the same
      # step here: start the build, wait for /healthz, and call it as a client
      # would (scripts/check-connector.mjs, which says what each check holds).
      #
      # --tools-fingerprint compares each tool's definition with the hash
      # pinned in scripts/tools-fingerprint.json. A definition that changes
      # makes claude.ai ask every user who chose "Always allow" to approve the
      # tool again, so a pull request that changes one says so in that file.
      #
      # The server reads optimtoken.optimnow.io, as in production. Exit 2 means
      # the build passed and the site did not answer the script either: a
      # warning, because an outage of the site must not hold every pull
      # request. A site that answers while the build cannot read it is exit 1.
      #
      # No secret reaches this step: it runs the code of any pull request.
      - name: Start the built server and check what it serves
        env:
          PORT: "3000"
        run: |
          set -euo pipefail
          node dist/server/src/index.js > "$RUNNER_TEMP/server.log" 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          up=false
          for _ in $(seq 1 30); do
            if curl --silent --fail --max-time 2 --output /dev/null "http://localhost:$PORT/healthz"; then up=true; break; fi
            kill -0 "$server" 2>/dev/null || break
            sleep 1
          done
          if [ "$up" != true ]; then
            echo "::error title=The built server did not start::No answer from /healthz. Its log follows."
            cat "$RUNNER_TEMP/server.log"
            exit 1
          fi
          set +e
          node scripts/check-connector.mjs "http://localhost:$PORT/mcp" \
            --tools-fingerprint scripts/tools-fingerprint.json \
            --attempts 2 --delay 10 --output "$RUNNER_TEMP/connector-check.md"
          code=$?
          set -e
          cat "$RUNNER_TEMP/connector-check.md" >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          echo "── server log"
          tail -n 40 "$RUNNER_TEMP/server.log" || true
          case "$code" in
            0) ;;
            2) echo "::warning title=Site not read::The build passed; optimtoken.optimnow.io did not answer during the check." ;;
            *) exit 1 ;;
          esac

  # Deploys master to Fly.io once `check` has passed, so a merge that breaks the
  # typecheck, the tests or the build never reaches the live connector. Before
  # this job, deploying was a manual `fly deploy` that was easy to forget: the
  # live server sat on 0.3.0 for 24 commits while master was on 0.4.0.
  #
  # Needs the FLY_API_TOKEN repository secret, an app-scoped deploy token:
  #   fly tokens create deploy --app ai-pricing-hub-mcp
  #
  # Dependabot merges do not deploy on their own: auto-merge is queued with
  # GITHUB_TOKEN, and GitHub does not start workflows from pushes made with
  # that token. They ship with the next human merge, or straight away from
  # Actions -> CI -> Run workflow on master.
  #
  # A push that changes only documentation since the live commit does not roll
  # the machine (see "Decide whether anything deployable changed").
  deploy:
    needs: check
    if: >-
      github.repository == 'OptimNow/ai-pricing-hub-mcp' &&
      github.ref == 'refs/heads/master' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    # A rollout that hangs would otherwise hold the deploy lock for six hours.
    timeout-minutes: 30
    # One deploy at a time, and never cancel one halfway through a rollout.
    # deploy-tag.yml takes the same group.
    concurrency:
      group: fly-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Full history, so the next step can diff against the live commit.
          fetch-depth: 0
          persist-credentials: false

      # flyctl pinned too: without `version` the action installs whatever was
      # released that morning, on the run that holds the deploy token. 0.5.14
      # is the version that deployed 0.12.1 on 2026-11-21. deploy-tag.yml pins
      # the same one: change both together.
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # 1.6
        with:
          version: 0.5.14

      # Skips the rollout when only documentation changed since the commit that
      # is live. Every deploy labels its image with the commit SHA (below), and
      # the machines report that label back as image_ref.tag.
      #
      # It diffs against the live commit, not the previous push, on purpose:
      # Dependabot merges never run this workflow, so a docs-only human merge
      # that follows them still carries their lockfile changes and must deploy.
      # Anything it cannot establish deploys: a manual run, an image without a
      # commit label (any `fly deploy` by hand), machines on different images,
      # a commit missing from this history, or flyctl failing.
      - name: Decide whether anything deployable changed
        id: changes
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          deploy=true
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            echo "Manual run: deploying."
          else
            live=$(flyctl machine list --app ai-pricing-hub-mcp --json \
              | jq -r '[.[].image_ref.tag] | unique | if length == 1 then .[0] else "" end' || true)
            if [[ "$live" =~ ^[0-9a-f]{40}$ ]] && git cat-file -e "$live^{commit}" 2>/dev/null; then
              changed=$(git diff --name-only "$live" HEAD)
              echo "Changed since the live commit $live:"
              echo "${changed:-  (nothing)}"
              # Documentation: Markdown anywhere, docs/, LICENSE. Nothing else.
              if ! grep -vE '\.md$|^docs/|^LICENSE$' <<<"$changed" | grep -q .; then
                deploy=false
                echo "::notice::Only documentation changed since $live, so the live machine was not redeployed."
              fi
            else
              echo "Live commit not known ('${live:-none}'): deploying."
            fi
          fi
          echo "deploy=$deploy" >> "$GITHUB_OUTPUT"

      # Builds the Dockerfile on Fly's remote builder and rolls the machine.
      # The image label is what the step above reads on the next push.
      - if: steps.changes.outputs.deploy == 'true'
        run: flyctl deploy --remote-only --image-label "$GITHUB_SHA"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      # A deploy that exits 0 has not necessarily put this commit live, and the
      # version cannot tell: most merges do not change it, so the version check
      # below passes as well on the previous image. Every deploy labels its
      # image with its commit; every machine must now report this one.
      - name: Check every machine runs this commit's image
        if: steps.changes.outputs.deploy == 'true'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          tags=$(flyctl machine list --app ai-pricing-hub-mcp --json | jq -r '[.[].image_ref.tag] | unique | join(" ")')
          echo "Machines run: ${tags:-nothing readable}; this commit: $GITHUB_SHA"
          if [ "$tags" != "$GITHUB_SHA" ]; then
            echo "::error title=Not this commit's image::The machines run '${tags:-nothing readable}', not $GITHUB_SHA."
            exit 1
          fi

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      # Then call it, as a user's client would: the version this commit
      # declares, the eight tools and their schemas, one answer from each tool
      # with its source line, eight calls at once, /healthz
      # (scripts/check-connector.mjs, which says what each check holds). The
      # first call can pay a machine start (scale-to-zero), hence the attempts.
      # It also runs when the deploy was skipped: the version lives in files the
      # skip never covers, so it must still match.
      #
      # The registry publish and the GitHub release wait for this step. Exit 2
      # means the server passed and optimtoken.optimnow.io could not be read
      # (answers from the snapshot): a warning, not a reason to hold a release
      # that is live and correct. The daily production-check.yml keeps asking.
      # The script asks the site itself before it says so: a server that falls
      # back while the site answers is exit 1, and nothing is published.
      - name: Check the live connector
        run: |
          set +e
          node scripts/check-connector.mjs https://ai-pricing-hub-mcp.fly.dev/mcp \
            --attempts 6 --delay 10 --output "$RUNNER_TEMP/connector-check.md"
          code=$?
          set -e
          cat "$RUNNER_TEMP/connector-check.md" >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          case "$code" in
            0) ;;
            2) echo "::warning title=Site not read::The connector passed; optimtoken.optimnow.io could not be read during the check." ;;
            *) exit 1 ;;
          esac

  # Publishes server.json to the MCP registry once `deploy` has put this commit
  # live and checked what it serves. The job is publish-registry.yml,
  # which can also be started by hand; its head says what it refuses and why.
  # On most pushes it publishes nothing, because the registry already holds the
  # version. The push that changes the version in server.json publishes it,
  # and a published version can never be edited.
  #
  # Skipped whenever `deploy` is skipped or fails: a pull request, a fork, a
  # rollout that failed, machines on another image, a live server that
  # announces another version or answers a tool wrongly.
  #
  # `id-token: write` is granted to this job alone. It is the credential the
  # registry accepts as this repository's, and `check` runs `npm ci` and the
  # tests of any pull request: it must never hold it.
  publish-registry:
    needs: deploy
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/publish-registry.yml
    with:
      after_deploy: true

  # Creates the tag v<version> and its GitHub release once `deploy` has put the
  # version live, when GitHub has no release of that version yet. On most
  # pushes it creates nothing.
  #
  # WHY. Nothing created releases: v0.3.0 was made by hand on 2026-08-18, and
  # the Releases box of the repository still showed it as the latest on
  # 2026-11-12, while production served 0.11.0, ten versions later. It is the
  # same forgotten manual step as the registry publish above, on another
  # listing.
  #
  # The tag goes on the commit of this run. For a version bump that is the
  # commit that set the version. The first form of this job looked up that
  # commit in the history and tagged it whatever the run's commit was; on
  # 2026-11-12, catching up on 0.11.0, GitHub refused with HTTP 403 "Resource
  # not accessible by integration". The likely reason, which the message does
  # not state: the run's token cannot hold the `workflows` permission, and
  # GitHub asks for it to create a ref on a commit whose workflow files are
  # not the branch's (that commit's differed by 332 lines). So when the job
  # catches up, the tag is on the commit that was live when it ran. Do not
  # bring the lookup back without a token that can do it.
  #
  # The notes are GitHub's own (the pull requests merged since the previous
  # release). Unlike a registry entry, a release and its tag can be edited or
  # deleted afterwards.
  #
  # A GitHub API that does not answer is a warning and a green run, as for the
  # registry: the next deploy asks again.
  #
  # `contents: write` is granted to this job alone, and it runs no code from
  # the repository: git and gh only.
  github-release:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # creates the tag and the release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Create the release of this version if GitHub has none
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          version=$(jq -er .version server.json)
          tag="v$version"

          # The address of this one release: 200 or 404. The body goes to a
          # file: with --retry, curl gives up at its first retry when the
          # output is /dev/null (see publish-registry.yml).
          status=$(curl --silent --show-error --max-time 30 --retry 2 \
            --output "${RUNNER_TEMP:-/tmp}/github-release.json" --write-out '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases/tags/$tag" || true)
          [ "$status" != "000" ] || status=""
          echo "releases/tags/$tag -> HTTP ${status:-none, no answer}"
          case "$status" in
            200)
              echo "::notice title=Nothing to release::GitHub already has the release $tag."
              echo "GitHub already has the release \`$tag\`. Nothing was created." >> "$GITHUB_STEP_SUMMARY"
              exit 0
              ;;
            404) ;;
            *)
              echo "::warning title=GitHub release not created::GitHub gave no usable answer (HTTP ${status:-none}), so whether the release $tag exists is not known and nothing was created. The next deploy asks again."
              exit 0
              ;;
          esac

          echo "Releasing $tag at $GITHUB_SHA"
          gh release create "$tag" --target "$GITHUB_SHA" --title "$tag" --generate-notes --latest
          echo "Created the release \`$tag\` at \`$GITHUB_SHA\`." >> "$GITHUB_STEP_SUMMARY"
