name: CI

on:
  pull_request:
  push:
    branches: [master]
  # Lets a deploy be re-run by hand from the Actions tab.
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Matches the engines field in package.json.
          node-version: "24"
          cache: npm

      - run: npm ci

      # Type-checks the server and widgets, then the test files separately —
      # tests are excluded from the build config so they stay out of dist.
      - run: npm run typecheck

      # Offline and deterministic: no network, no server to boot.
      - run: npm test

      - run: npm run build

  # Deploys master to Fly.io once `check` has passed, so a merge that breaks the
  # typecheck, the tests or the build never reaches the live connector. Before
  # this job, deploying was a manual `fly deploy` that was easy to forget: the
  # live server sat on 0.3.0 for 24 commits while master was on 0.4.0.
  #
  # Needs the FLY_API_TOKEN repository secret, an app-scoped deploy token:
  #   fly tokens create deploy --app ai-pricing-hub-mcp
  #
  # Dependabot merges do not deploy on their own: auto-merge is queued with
  # GITHUB_TOKEN, and GitHub does not start workflows from pushes made with
  # that token. They ship with the next human merge, or straight away from
  # Actions -> CI -> Run workflow on master.
  deploy:
    needs: check
    if: >-
      github.repository == 'OptimNow/ai-pricing-hub-mcp' &&
      github.ref == 'refs/heads/master' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    # One deploy at a time, and never cancel one halfway through a rollout.
    concurrency:
      group: fly-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@1.6

      # Builds the Dockerfile on Fly's remote builder and rolls the machine.
      - run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      # A deploy that exits 0 has not necessarily put this commit live. Ask the
      # server which version it runs and compare it with the one this commit
      # declares. The first call can also pay a machine start (scale-to-zero),
      # hence the retries.
      - name: Check the live server runs this commit's version
        run: |
          expected=$(grep -oP '^\s*version: "\K[^"]+' server/src/index.ts)
          for attempt in 1 2 3 4 5 6; do
            actual=$(curl -sS -m 30 -X POST https://ai-pricing-hub-mcp.fly.dev/mcp \
              -H 'Content-Type: application/json' \
              -H 'Accept: application/json, text/event-stream' \
              -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"deploy-check","version":"0"}}}' \
              | grep -oP '"serverInfo":\{"name":"[^"]*","version":"\K[^"]+' || true)
            echo "attempt $attempt: live=${actual:-none} expected=$expected"
            [ "$actual" = "$expected" ] && exit 0
            sleep 10
          done
          echo "::error::Live server reports '${actual:-no answer}', expected '$expected'"
          exit 1
