name: CI

on:
  pull_request:
  push:
    branches: [master]
  # Lets a deploy be re-run by hand from the Actions tab.
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Matches the engines field in package.json.
          node-version: "24"
          cache: npm

      - run: npm ci

      # Type-checks the server, then the test files separately —
      # tests are excluded from the build config so they stay out of dist.
      - run: npm run typecheck

      # Offline and deterministic: no network, no server to boot.
      - run: npm test

      - run: npm run build

  # Deploys master to Fly.io once `check` has passed, so a merge that breaks the
  # typecheck, the tests or the build never reaches the live connector. Before
  # this job, deploying was a manual `fly deploy` that was easy to forget: the
  # live server sat on 0.3.0 for 24 commits while master was on 0.4.0.
  #
  # Needs the FLY_API_TOKEN repository secret, an app-scoped deploy token:
  #   fly tokens create deploy --app ai-pricing-hub-mcp
  #
  # Dependabot merges do not deploy on their own: auto-merge is queued with
  # GITHUB_TOKEN, and GitHub does not start workflows from pushes made with
  # that token. They ship with the next human merge, or straight away from
  # Actions -> CI -> Run workflow on master.
  #
  # A push that changes only documentation since the live commit does not roll
  # the machine (see "Decide whether anything deployable changed").
  deploy:
    needs: check
    if: >-
      github.repository == 'OptimNow/ai-pricing-hub-mcp' &&
      github.ref == 'refs/heads/master' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    # One deploy at a time, and never cancel one halfway through a rollout.
    concurrency:
      group: fly-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, so the next step can diff against the live commit.
          fetch-depth: 0

      - uses: superfly/flyctl-actions/setup-flyctl@1.6

      # Skips the rollout when only documentation changed since the commit that
      # is live. Every deploy labels its image with the commit SHA (below), and
      # the machines report that label back as image_ref.tag.
      #
      # It diffs against the live commit, not the previous push, on purpose:
      # Dependabot merges never run this workflow, so a docs-only human merge
      # that follows them still carries their lockfile changes and must deploy.
      # Anything it cannot establish deploys: a manual run, an image without a
      # commit label (any `fly deploy` by hand), machines on different images,
      # a commit missing from this history, or flyctl failing.
      - name: Decide whether anything deployable changed
        id: changes
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          deploy=true
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            echo "Manual run: deploying."
          else
            live=$(flyctl machine list --app ai-pricing-hub-mcp --json \
              | jq -r '[.[].image_ref.tag] | unique | if length == 1 then .[0] else "" end' || true)
            if [[ "$live" =~ ^[0-9a-f]{40}$ ]] && git cat-file -e "$live^{commit}" 2>/dev/null; then
              changed=$(git diff --name-only "$live" HEAD)
              echo "Changed since the live commit $live:"
              echo "${changed:-  (nothing)}"
              # Documentation: Markdown anywhere, docs/, LICENSE. Nothing else.
              if ! grep -vE '\.md$|^docs/|^LICENSE$' <<<"$changed" | grep -q .; then
                deploy=false
                echo "::notice::Only documentation changed since $live, so the live machine was not redeployed."
              fi
            else
              echo "Live commit not known ('${live:-none}'): deploying."
            fi
          fi
          echo "deploy=$deploy" >> "$GITHUB_OUTPUT"

      # Builds the Dockerfile on Fly's remote builder and rolls the machine.
      # The image label is what the step above reads on the next push.
      - if: steps.changes.outputs.deploy == 'true'
        run: flyctl deploy --remote-only --image-label "$GITHUB_SHA"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      # A deploy that exits 0 has not necessarily put this commit live. Ask the
      # server which version it runs and compare it with the one this commit
      # declares. The first call can also pay a machine start (scale-to-zero),
      # hence the retries. It also runs when the deploy was skipped: the
      # version lives in files the skip never covers, so it must still match.
      - name: Check the live server runs this commit's version
        run: |
          expected=$(grep -oP '^\s*version: "\K[^"]+' server/src/index.ts)
          for attempt in 1 2 3 4 5 6; do
            actual=$(curl -sS -m 30 -X POST https://ai-pricing-hub-mcp.fly.dev/mcp \
              -H 'Content-Type: application/json' \
              -H 'Accept: application/json, text/event-stream' \
              -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"deploy-check","version":"0"}}}' \
              | grep -oP '"serverInfo":\{"name":"[^"]*","version":"\K[^"]+' || true)
            echo "attempt $attempt: live=${actual:-none} expected=$expected"
            [ "$actual" = "$expected" ] && exit 0
            sleep 10
          done
          echo "::error::Live server reports '${actual:-no answer}', expected '$expected'"
          exit 1

  # Publishes server.json to the MCP registry once `deploy` has put this commit
  # live and checked the version it announces. The job is publish-registry.yml,
  # which can also be started by hand; its head says what it refuses and why.
  # On most pushes it publishes nothing, because the registry already holds the
  # version. The push that changes the version in server.json publishes it,
  # and a published version can never be edited.
  #
  # Skipped whenever `deploy` is skipped or fails: a pull request, a fork, a
  # rollout that failed, a live server that announces another version.
  #
  # `id-token: write` is granted to this job alone. It is the credential the
  # registry accepts as this repository's, and `check` runs `npm ci` and the
  # tests of any pull request: it must never hold it.
  publish-registry:
    needs: deploy
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/publish-registry.yml
    with:
      after_deploy: true

  # Creates the tag v<version> and its GitHub release once `deploy` has put the
  # version live, when GitHub has no release of that version yet. On most
  # pushes it creates nothing.
  #
  # WHY. Nothing created releases: v0.3.0 was made by hand on 2026-08-18, and
  # the Releases box of the repository still showed it as the latest on
  # 2026-11-12, while production served 0.11.0, ten versions later. It is the
  # same forgotten manual step as the registry publish above, on another
  # listing.
  #
  # The tag goes on the commit that set the version in server.json, not on the
  # commit of this run: a push that changes only a document under the same
  # version must not move where "v0.11.0" points. Read from the history, hence
  # the full fetch.
  #
  # The notes are GitHub's own (the pull requests merged since the previous
  # release). Unlike a registry entry, a release and its tag can be edited or
  # deleted afterwards.
  #
  # A GitHub API that does not answer is a warning and a green run, as for the
  # registry: the next deploy asks again.
  #
  # `contents: write` is granted to this job alone, and it runs no code from
  # the repository: git and gh only.
  github-release:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # creates the tag and the release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Create the release of this version if GitHub has none
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          version=$(jq -er .version server.json)
          tag="v$version"

          # The address of this one release: 200 or 404. The body goes to a
          # file: with --retry, curl gives up at its first retry when the
          # output is /dev/null (see publish-registry.yml).
          status=$(curl --silent --show-error --max-time 30 --retry 2 \
            --output "${RUNNER_TEMP:-/tmp}/github-release.json" --write-out '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases/tags/$tag" || true)
          [ "$status" != "000" ] || status=""
          echo "releases/tags/$tag -> HTTP ${status:-none, no answer}"
          case "$status" in
            200)
              echo "::notice title=Nothing to release::GitHub already has the release $tag."
              echo "GitHub already has the release \`$tag\`. Nothing was created." >> "$GITHUB_STEP_SUMMARY"
              exit 0
              ;;
            404) ;;
            *)
              echo "::warning title=GitHub release not created::GitHub gave no usable answer (HTTP ${status:-none}), so whether the release $tag exists is not known and nothing was created. The next deploy asks again."
              exit 0
              ;;
          esac

          # The last commit that changed the version line of server.json. If the
          # history does not give one whose server.json holds this version,
          # the commit of this run is the honest fallback.
          target=$(git log -1 --format=%H -G'^\s*"version":' -- server.json || true)
          if [ -z "$target" ] || [ "$(git show "$target:server.json" | jq -r .version)" != "$version" ]; then
            target="$GITHUB_SHA"
          fi
          echo "Releasing $tag at $target"

          gh release create "$tag" --target "$target" --title "$tag" --generate-notes --latest
          echo "Created the release \`$tag\` at \`$target\`." >> "$GITHUB_STEP_SUMMARY"
