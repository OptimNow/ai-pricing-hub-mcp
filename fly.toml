# Fly.io app for the hosted connector. `fly deploy` from the repo root builds
# the Dockerfile and rolls the app. Same layout as the Cloud FinOps connector
# (OptimNow/cloud-finops-skills), which moved off Alpic on 2026-09-09 when the
# shared free quota returned HTTP 402 to every OptimNow connector.
#
# The public URL is https://optimtoken-mcp.optimnow.io/mcp: a custom domain
# (CNAME optimtoken-mcp.optimnow.io -> ai-pricing-hub-mcp.fly.dev in the
# optimnow.io zone, certificate issued with `fly certs add`). The /mcp path is
# required: Fly does not map the root the way Alpic did. That URL is one
# constant, PUBLIC_MCP_URL in server/src/lib/public-url.ts, and the claude.ai
# widget sandbox domain is a hash of it, pinned by a test, so the URL and this
# comment move together. The ai-pricing-hub-mcp.fly.dev host still answers
# tool calls (the CI deploy job reads its version) but widgets do not render
# through it, because the hash is of the published URL.
#
# Scale-to-zero: the machine stops when idle and restarts on the next request.
# That also drops the in-memory pricing caches warmed at boot (see the
# "caches are warmed at boot" note in CLAUDE.md), so the first call after an
# idle stop pays the machine start plus an upstream fetch. Set
# min_machines_running = 1 to keep one machine up if that latency matters.

app = "ai-pricing-hub-mcp"
primary_region = "cdg"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
